version: 2
updates:
  # npm ecosystem (Dependabot updates pnpm-lock.yaml through it)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint supports TypeScript <6.1 only (typescript-eslint#10940); TS 7 breaks `pnpm lint`.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      # Group all patch updates together
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Mantine UI
      mantine:
        patterns:
          - "@mantine/*"
        update-types:
          - "minor"
          - "patch"
      # React and React Router
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      # Vite
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@tailwindcss/vite"
        update-types:
          - "minor"
          - "patch"
      # Hono
      hono:
        patterns:
          - "hono"
          - "@hono/*"
        update-types:
          - "minor"
          - "patch"
      # Drizzle and Postgres drivers
      drizzle-pg:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
          - "pg"
          - "@types/pg"
          - "@electric-sql/pglite"
        update-types:
          - "minor"
          - "patch"
      # Discord.js
      discord:
        patterns:
          - "discord.js"
          - "@discordjs/*"
        update-types:
          - "minor"
          - "patch"
      # TypeScript type definitions
      typescript-types:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      # Tailwind CSS
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      # ESLint
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
        update-types:
          - "minor"
          - "patch"
      # Vitest
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "slamanna212"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    assignees:
      - "slamanna212"
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
    labels:
      - "github-actions"
      - "dependencies"
      - "automated"

  # Docker (Dockerfile base images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # A Postgres major bump needs the dump/restore procedure (plan 7.3), not a PR.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
    assignees:
      - "slamanna212"
    commit-message:
      prefix: "docker"
      prefix-development: "docker"
    labels:
      - "docker"
      - "dependencies"
      - "automated"
