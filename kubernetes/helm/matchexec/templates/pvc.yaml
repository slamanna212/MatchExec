{{- define "matchexec.pvc" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}
  labels:
    {{- include "matchexec.labels" (dict "ctx" .ctx "component" .component) | nindent 4 }}
  {{- if .cfg.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
spec:
  accessModes:
    - {{ .cfg.accessMode }}
  {{- if .cfg.storageClass }}
  {{- if (eq "-" .cfg.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .cfg.storageClass | quote }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .cfg.size }}
{{- end }}
{{- if and (eq .Values.mode "aio") .Values.aio.persistence.enabled (not .Values.aio.persistence.existingClaim) }}
{{ include "matchexec.pvc" (dict "ctx" . "component" "aio" "cfg" .Values.aio.persistence "name" (printf "%s-data" (include "matchexec.fullname" .))) }}
{{- end }}
{{- if and (eq .Values.mode "split") .Values.scheduler.enabled .Values.backups.persistence.enabled (not .Values.backups.persistence.existingClaim) }}
---
{{ include "matchexec.pvc" (dict "ctx" . "component" "scheduler" "cfg" .Values.backups.persistence "name" (printf "%s-backups" (include "matchexec.fullname" .))) }}
{{- end }}
