{{- if and (eq .Values.mode "split") (not .Values.database.existingSecret) .Values.database.url -}}
{{- /*
  Rendered as a hook resource (weight -10) so that it already exists when the pre-install migration Job runs.
  before-hook-creation (no delete after) keeps it in place for the Deployments.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matchexec.databaseSecretName" . }}
  labels:
    {{- include "matchexec.labels" (dict "ctx" . "component" "database") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
