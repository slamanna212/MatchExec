# Refuse packages published in the last 7 days (minutes)
minimumReleaseAge: 10080

# pnpm blocks dependency install scripts by default; list what genuinely needs them.
allowBuilds:
  esbuild: true
  bufferutil: true    # optional ws native addon
  sharp: false        # prebuilt binaries come via optional deps
  unrs-resolver: false # prebuilt binaries come via optional deps
